<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跃动 · 运动技能自学计划</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🦋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --bg:#f4f1ea;
  --bg2:#fff9f0;
  --panel:#ffffff;
  --panel2:#f8f5ef;
  --line:#e8e2d5;
  --text:#2d2640;
  --muted:#8a8599;
  --accent:#ff6b35;
  --accent2:#ffc233;
  --good:#2ec4b6;
  --warn:#e71d36;
  --sky:#4cc9f0;
  --rad:18px;
  --shadow:0 8px 30px rgba(45,38,64,.08);
  --shadow-lg:0 12px 44px rgba(45,38,64,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Noto Sans SC',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  letter-spacing:.01em;
}
/* 阳光背景纹理 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,194,51,.25), transparent 38%),
    radial-gradient(circle at 88% 12%, rgba(76,201,240,.15), transparent 40%),
    radial-gradient(circle at 75% 90%, rgba(46,196,182,.12), transparent 42%),
    repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,194,51,.02) 14px 15px);
}
#app{
  position:relative;z-index:1;
  max-width:480px;margin:0 auto;height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);
  box-shadow:0 0 50px rgba(45,38,64,.1);
  overflow:hidden;
}
.header{
  flex-shrink:0;padding:16px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(12px);
}
.logo{font-family:'Fredoka','Noto Sans SC',sans-serif;font-weight:700;font-size:24px;letter-spacing:.02em;color:var(--text)}
.logo span{color:var(--accent)}
.header .pill{
  font-size:12px;color:var(--accent);font-weight:600;
  padding:6px 14px;border:1.5px solid rgba(255,107,53,.25);
  border-radius:30px;background:rgba(255,107,53,.06);
}
.viewport{flex:1;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.viewport::-webkit-scrollbar{width:0}
.tabbar{
  flex-shrink:0;display:flex;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 0 max(6px,env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0;color:var(--muted);font-size:11px;cursor:pointer;transition:.25s;
  border:none;background:none;font-family:inherit;font-weight:500;
}
.tab .ico{font-size:20px;transition:.25s}
.tab.active{color:var(--accent)}
.tab.active .ico{transform:translateY(-3px) scale(1.1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 通用组件 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 20px;border-radius:14px;border:none;cursor:pointer;
  font-family:inherit;font-weight:600;font-size:15px;transition:.2s;
  background:linear-gradient(135deg,var(--accent),#ff8556);color:#fff;
  box-shadow:0 6px 18px rgba(255,107,53,.25);
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn.done{background:linear-gradient(135deg,var(--good),#45d4c6)}
.btn[disabled]{opacity:.4;pointer-events:none}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--rad);padding:18px;margin:14px;
  box-shadow:var(--shadow);
}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-size:15px;font-weight:700;margin:20px 20px 10px;color:var(--text);
}
.section-title::before{content:"";width:4px;height:18px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:4px}

/* 首页 */
.hero{
  margin:14px;border-radius:22px;
  padding:26px 24px;color:#fff;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 80% 0%, rgba(255,194,51,.5), transparent 55%),
    radial-gradient(circle at 10% 100%, rgba(255,107,53,.3), transparent 50%),
    linear-gradient(135deg,#ff6b35,#ff3d6a);
  box-shadow:0 10px 36px rgba(255,107,53,.2);
}
.hero::after{
  content:"☀️";position:absolute;top:-10px;right:14px;font-size:42px;opacity:.25;
  animation:sunPulse 3s ease-in-out infinite;
}
@keyframes sunPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(15deg)}}
.hero h1{font-family:'Fredoka','Noto Sans SC',sans-serif;font-size:28px;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.hero p{font-size:13px;opacity:.92}
.hero .stat-row{display:flex;gap:12px;margin-top:18px}
.hero .stat{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:12px;backdrop-filter:blur(4px)}
.hero .stat .n{font-size:22px;font-weight:700}
.hero .stat .l{font-size:11px;opacity:.85}
.quick-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px}
.quick-item{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px 6px;text-align:center;cursor:pointer;transition:.2s;
  box-shadow:var(--shadow);
}
.quick-item:active{transform:scale(.93)}
.quick-item .emoji{font-size:28px}
.quick-item .name{font-size:11px;margin-top:6px;color:var(--text);font-weight:500}

/* 表单 */
.field{margin:14px 20px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
.field input,.field select{
  width:100%;padding:14px 16px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:12px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
  transition:.2s;
}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,.1)}
.sport-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 20px}
.sport-card{
  background:var(--panel);border:2px solid var(--line);border-radius:16px;
  padding:16px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);
}
.sport-card.sel{border-color:var(--accent);background:linear-gradient(135deg,rgba(255,107,53,.08),transparent)}
.sport-card .emoji{font-size:30px}
.sport-card .info .n{font-weight:600;font-size:14px;color:var(--text)}
.sport-card .info .d{font-size:11px;color:var(--muted);margin-top:2px}

/* 计划总览 */
.plan-head{
  margin:14px;padding:20px;border-radius:20px;
  background:linear-gradient(135deg,#fff9f0,#fff4e6);
  border:1.5px solid rgba(255,194,51,.3);
  box-shadow:var(--shadow);
}
.plan-head h2{font-family:'Fredoka','Noto Sans SC',sans-serif;font-size:22px;margin-bottom:6px;color:var(--text)}
.plan-head .meta{font-size:12px;color:var(--muted)}
.stage-tabs{display:flex;gap:8px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.stage-tabs::-webkit-scrollbar{display:none}
.stage-chip{
  flex-shrink:0;padding:8px 14px;border-radius:30px;
  background:var(--panel);border:1.5px solid var(--line);font-size:12px;font-weight:500;
  color:var(--muted);cursor:pointer;transition:.2s;
}
.stage-chip.active{background:linear-gradient(135deg,var(--accent),#ff8556);color:#fff;border-color:transparent}
.stage-chip.done{background:rgba(46,196,182,.12);color:var(--good);border-color:rgba(46,196,182,.4)}
.day-list{padding:8px 14px 20px}
.day-row{
  display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:10px;cursor:pointer;transition:.2s;
  box-shadow:var(--shadow);
}
.day-row:active{transform:scale(.99)}
.day-row.checked{opacity:.55}
.day-num{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent2),#ffd55e);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;flex-shrink:0;color:var(--text);
}
.day-row.checked .day-num{background:linear-gradient(135deg,var(--good),#45d4c6);color:#fff}
.day-info{flex:1}
.day-info .t{font-size:14px;font-weight:600;color:var(--text)}
.day-info .s{font-size:11px;color:var(--muted);margin-top:2px}
.day-act{font-size:20px}

/* 单日详情 */
.ex-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.ex-card.warmup{border-left:4px solid var(--accent2)}
.ex-card.main{border-left:4px solid var(--accent)}
.ex-card.cooldown{border-left:4px solid var(--good)}
.ex-head{display:flex;align-items:center;justify-content:space-between}
.ex-head .name{font-weight:600;font-size:15px;color:var(--text)}
.ex-head .tag{font-size:11px;color:var(--muted);background:var(--panel2);padding:3px 10px;border-radius:20px}
.ex-body{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
.ex-actions{display:flex;gap:8px;margin-top:12px}
.ex-actions button{flex:1}
.video-btn{
  display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;
  background:rgba(255,107,53,.08);color:var(--accent);border:1px solid rgba(255,107,53,.2);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
}
.video-btn:active{transform:scale(.98)}

/* 跟练模态 */
.modal-bg{
  position:fixed;inset:0;background:rgba(45,38,64,.4);backdrop-filter:blur(6px);z-index:50;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:linear-gradient(180deg,#fff9f0,#fff);border-radius:28px;padding:24px;width:100%;max-width:420px;
  border:1px solid var(--line);position:relative;box-shadow:var(--shadow-lg);
}
.timer-ring{
  width:220px;height:220px;margin:10px auto;position:relative;
}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.timer-ring .track{stroke:#f0ebe0}
.timer-ring .prog{stroke:var(--accent);transition:stroke-dashoffset .3s linear}
.timer-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.timer-time{font-size:44px;font-weight:700;font-family:'Fredoka','Noto Sans SC',sans-serif;color:var(--text)}
.timer-ex{font-size:14px;color:var(--muted);text-align:center;padding:0 20px;margin-top:4px}
.timer-ctrl{display:flex;justify-content:center;gap:12px;margin-top:14px}
.timer-ctrl button{
  width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#ff8556);color:#fff;font-size:22px;
  box-shadow:0 6px 18px rgba(255,107,53,.25);
}
.timer-ctrl button.sq{background:var(--panel2);box-shadow:none;color:var(--text)}
.timer-progress{display:flex;gap:4px;margin:14px 0;flex-wrap:wrap}
.timer-dot{width:8px;height:8px;border-radius:50%;background:#e0dccf;flex:0 0 auto}
.timer-dot.cur{background:var(--accent);transform:scale(1.3)}
.timer-dot.done{background:var(--good)}
.modal-close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  background:var(--panel2);border:none;color:var(--muted);cursor:pointer;font-size:18px;
}

/* 进度页 */
.progress-circle{
  width:180px;height:180px;margin:20px auto;position:relative;
}
.progress-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-circle .track{fill:none;stroke:#f0ebe0;stroke-width:12}
.progress-circle .prog{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s}
.progress-circle .center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.progress-circle .pct{font-size:40px;font-weight:700;font-family:'Fredoka','Noto Sans SC',sans-serif;color:var(--text)}
.progress-circle .lbl{font-size:12px;color:var(--muted)}
.milestone{
  display:flex;gap:12px;padding:14px;background:var(--panel);
  border-radius:16px;margin:0 14px 10px;border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.milestone.done{background:linear-gradient(135deg,rgba(46,196,182,.08),transparent);border-color:rgba(46,196,182,.4)}
.milestone .ic{
  width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),#ffd55e);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.milestone.done .ic{background:linear-gradient(135deg,var(--good),#45d4c6)}
.milestone .info h4{font-size:14px;color:var(--text)}
.milestone .info p{font-size:12px;color:var(--muted);margin-top:2px}

/* 我的 */
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.toggle{
  width:44px;height:24px;background:#e0dccf;border-radius:30px;position:relative;cursor:pointer;
  transition:.25s;
}
.toggle.on{background:var(--good)}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.toggle.on::after{left:22px}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;padding:12px 20px;border-radius:30px;
  font-size:13px;z-index:100;box-shadow:var(--shadow-lg);
  animation:toastIn .3s ease;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1}}

.confetti{position:fixed;width:8px;height:8px;z-index:200;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}

.empty{
  text-align:center;padding:60px 30px;color:var(--muted);
}
.empty .emoji{font-size:60px;margin-bottom:16px}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--text)}
.empty p{font-size:13px;line-height:1.7}

/* 计划表格 */
.plan-table-wrap{margin:0 14px 20px;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.plan-table{width:100%;border-collapse:collapse;font-size:12px}
.plan-table th{
  background:linear-gradient(180deg,var(--panel2),#f4f0e6);color:var(--muted);font-weight:600;
  padding:8px 6px;text-align:center;white-space:nowrap;position:sticky;top:0;
}
.plan-table td{
  padding:8px 6px;text-align:center;border-top:1px solid var(--line);
  vertical-align:middle;color:var(--text);
}
.plan-table tr.done td{opacity:.45}
.plan-table tr.done td:first-child{text-decoration:line-through}
.plan-table tr.today td{background:rgba(255,107,53,.06)}
.plan-table .stage-tag{
  display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;
}
.plan-table .day-cell{font-weight:700;font-size:13px}
.plan-table .action-cell{font-size:11px;color:var(--muted);line-height:1.5}

</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div class="logo">跃动<span>.</span></div>
    <div class="pill" id="streakPill">🔥 0 天连胜</div>
  </header>
  <div class="viewport" id="viewport"></div>
  <nav class="tabbar">
    <button class="tab active" data-tab="home"><span class="ico">🏠</span>首页</button>
    <button class="tab" data-tab="plan"><span class="ico">📅</span>计划</button>
    <button class="tab" data-tab="progress"><span class="ico">📊</span>进度</button>
    <button class="tab" data-tab="me"><span class="ico">👤</span>我的</button>
  </nav>
</div>

<div class="modal-bg" id="timerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeTimer()">✕</button>
    <div class="timer-ring">
      <svg viewBox="0 0 220 220">
        <circle class="track" cx="110" cy="110" r="100"></circle>
        <circle class="prog" cx="110" cy="110" r="100" id="ringProg" stroke-dasharray="628" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-center">
        <div class="timer-time" id="timerTime">00:00</div>
        <div class="timer-ex" id="timerEx">准备开始</div>
      </div>
    </div>
    <div class="timer-progress" id="timerDots"></div>
    <div class="timer-ctrl">
      <button class="sq" onclick="prevEx()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button class="sq" onclick="nextEx()">⏭</button>
    </div>
  </div>
</div>

<script>
/* ==================== 数据：运动项目库 ==================== */
const SPORTS = {
  run:{
    name:'跑步',emoji:'🏃',desc:'心肺耐力之王',
    stages:['起步适应','基础有氧','配速进阶'],
    basics:[
      {name:'正确跑姿入门',dur:10,tip:'挺胸放松，前脚掌或中足着地，步频约180步/分钟'},
      {name:'慢跑10分钟',dur:10,tip:'心率保持在最大心率的60-70%，能正常说话为宜'},
      {name:'呼吸节奏练习',dur:5,tip:'三步一吸三步一呼，避免口呼吸'},
      {name:'核心稳定跑',dur:8,tip:'保持身体中轴稳定，不左右晃动'},
      {name:'坡度走跑交替',dur:12,tip:'走2分钟+慢跑1分钟，循环4组'}
    ],
    advances:[
      {name:'间歇跑400m×6',dur:20,tip:'每组400米全力，组间慢跑恢复2分钟'},
      {name:'节奏跑20分钟',dur:25,tip:'比舒适跑快10-15秒/公里，保持稳定'},
      {name:'法特莱克跑',dur:30,tip:'快慢交替：快1分钟慢2分钟，循环6-8组'},
      {name:'长距离慢跑',dur:40,tip:'心率70%以下，感受脂肪供能'},
      {name:'5km计时挑战',dur:25,tip:'记录时间，每月复测一次'}
    ],
    searchQuery:'跑步 教学 零基础'
  },
  swim:{
    name:'游泳',emoji:'🏊',desc:'全身无损伤有氧',
    subTypes:{
      breaststroke:{
        name:'蛙泳',emoji:'🐸',
        stages:['水性适应','蛙泳技术','蛙泳提速'],
        basics:[
          {name:'水中站立与漂浮',dur:10,tip:'放松肩膀，让水托住身体，感受浮力'},
          {name:'呼吸换气练习',dur:10,tip:'抬头吸气、低头呼气，节奏稳定不慌张'},
          {name:'蛙泳腿分解',dur:15,tip:'收翻蹬夹四步：收腿慢、翻脚掌、蹬腿快、夹水合并'},
          {name:'浮板蛙泳腿',dur:12,tip:'手持浮板练习蛙泳腿，感受蹬夹推进力'},
          {name:'徒手划臂练习',dur:10,tip:'高肘抱水向外划，内收夹水，前伸滑行'}
        ],
        advances:[
          {name:'完整配合游25米',dur:15,tip:'划臂→换气→蹬腿→滑行，一组节奏完成后滑行2秒'},
          {name:'蛙泳换气配合',dur:15,tip:'双臂内收时抬头换气，前伸时低头入水'},
          {name:'连续游100米',dur:20,tip:'保持节奏不中断，每趟控制划水次数'},
          {name:'蛙泳转身技术',dur:12,tip:'双手触壁后转身蹬壁，滑行3秒后启动'},
          {name:'50米计时挑战',dur:10,tip:'全力游进，记录成绩作为基准'}
        ],
        searchQuery:'蛙泳 教学 零基础'
      },

// 从数组中取n个不重复元素
function pick(arr,n){
  const c=[...arr],r=[];
  for(let i=0;i<n&&c.length;i++){
    r.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);
  }
  return r;
}
function pickOne(arr){return arr[Math.floor(Math.random()*arr.length)]}

function getSportData(sport, subType){
  const sp = SPORTS[sport];
  if(sp.subTypes && subType && sp.subTypes[subType]){
    const sub = sp.subTypes[subType];
    return {
      ...sp,
      ...sub,
      name: sp.name+' '+sub.name,
      emoji: sub.emoji || sp.emoji,
      subTypeName: sub.name
    };
  }
  return sp;
}

// 获取里程碑列表
function getMilestones(sport, subType){
  const m = MILESTONES[sport];
  if(Array.isArray(m)) return m;
  if(m && subType && m[subType]) return m[subType];
  return ['持续练习，稳步提升','技术熟练，稳步提升','挑战自我，突破极限'];
}

/* ==================== 计划生成 ==================== */
function generatePlan(config){
  const {sport, totalDays, perDayMin, subType} = config;
  const sp = getSportData(sport, subType);
  const days = [];
  const numStages = sp.stages.length;
  const daysPerStage = Math.floor(totalDays/numStages);

  // 热身时长 15%，拉伸 10%，主训练 60%，体能 15%
  const warmupDur = Math.max(3, Math.round(perDayMin*0.15));
  const cooldownDur = Math.max(3, Math.round(perDayMin*0.1));
  const fitnessDur = perDayMin>=20 ? Math.round(perDayMin*0.15) : 0;
  const mainDur = perDayMin - warmupDur - cooldownDur - fitnessDur;

  for(let i=0;i<totalDays;i++){
    const stageIdx = Math.min(Math.floor(i/daysPerStage), numStages-1);
    const stageName = sp.stages[stageIdx];
    
    // 热身
    const warmupCount = Math.max(3, Math.min(6, Math.floor(warmupDur/0.5)));
    const warmup = pick(WARMUP, warmupCount).map(w=>({...w}));

    // 拉伸
    const cooldownCount = Math.max(2, Math.min(5, Math.floor(cooldownDur/0.5)));
    const cooldown = pick(COOLDOWN, cooldownCount).map(c=>({...c}));

    // 主训练：前1/3用基础动作，中间混合，后1/3用进阶动作
    const stageProgress = (i % daysPerStage) / daysPerStage;
    let pool;
    if(stageProgress < 0.4) pool = sp.basics;
    else if(stageProgress < 0.8) pool = [...sp.basics, ...sp.advances];
    else pool = sp.advances;

    // 每个动作约3-5分钟
    const mainCount = Math.max(2, Math.floor(mainDur/3));
    const main = pick(pool, Math.min(mainCount, pool.length)).map(m=>({...m}));

    // 体能（非每天都有，隔2天安排）
    let fitness = [];
    if(fitnessDur>0 && i%2===1){
      const fitPool = [...FITNESS.core, ...FITNESS.cardiopulmonary, ...FITNESS.balance];
      const fitCount = Math.max(2, Math.floor(fitnessDur/1));
      fitness = pick(fitPool, Math.min(fitCount, fitPool.length)).map(f=>({...f}));
    }

    days.push({
      day:i+1,
      stage:stageIdx,
      stageName,
      warmup,
      main,
      cooldown,
      fitness
    });
  }

  return {sport, subType, totalDays, perDayMin, days, stages:sp.stages};
}

    <div class="day-list">
      ${state.plan.days.filter(d=>currentStageFilter===-1||d.stage===currentStageFilter).map((d)=>{
        const idx = state.plan.days.indexOf(d);
        const done = state.done[idx];
        return `
          <div class="day-row ${done?'checked':''}" onclick="openDay(${idx})">
            <div class="day-num">${d.day}</div>
            <div class="day-info">
              <div class="t">${d.stageName}</div>
              <div class="s">主训练${d.main.length}个 · 热身${d.warmup.length}个 · 拉伸${d.cooldown.length}个</div>
            </div>
            <div class="day-act">${done?'✅':'›'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function openDay(idx){
  const day = state.plan.days[idx];
  const done = state.done[idx];
  const sp = getSportData(state.plan.sport, state.plan.subType);
  
  $('#viewport').innerHTML = `
    <div style="padding:14px 20px;display:flex;align-items:center;gap:10px">
      <button class="btn ghost sm" onclick="switchTab('${currentTab}')">← 返回</button>
      <div style="flex:1">
        <div style="font-size:18px;font-weight:700">第 ${day.day} 天</div>
        <div style="font-size:12px;color:var(--muted)">${day.stageName} · ${sp.name}</div>
      </div>
      ${done?'<span style="color:var(--good)">✅ 已完成</span>':''}
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:600">🎯 阶段任务</div>
      </div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">${getMilestones(state.plan.sport, state.plan.subType)[day.stage]}</div>
    </div>

    <div class="section-title">🔥 热身活动</div>
    ${day.warmup.map((e,i)=>exCard(e,'warmup',idx,'w',i)).join('')}

    ${day.fitness.length?`
      <div class="section-title">💪 体能补充</div>
      ${day.fitness.map((e,i)=>exCard(e,'main',idx,'f',i)).join('')}
    `:''}

    <div class="section-title">🎯 主训练</div>
    ${day.main.map((e,i)=>exCard(e,'main',idx,'m',i)).join('')}

    <div class="section-title">🧘 拉伸放松</div>
    ${day.cooldown.map((e,i)=>exCard(e,'cooldown',idx,'c',i)).join('')}

    <div style="padding:14px 20px 40px">
      ${done ? `<button class="btn block" onclick="startFollow('${idx}')">🔄 重新跟练</button>` : `<button class="btn block" onclick="startFollow('${idx}')">▶ 开始跟练</button>`}
    </div>
  `;
  $('#viewport').scrollTop = 0;
}

function exCard(e,type,dayIdx,pool,idx){
  const tag = {warmup:'热身',main:'主训练',cooldown:'拉伸',fitness:'体能'}[type]||'';
  const vidBtn = type==='main' ? `<button class="video-btn" onclick="openVideo('${state.plan.sport}','${e.name}')">▶ 教学视频</button>` : '';
  return `
    <div class="ex-card ${type}">
      <div class="ex-head">
        <div class="name">${e.name}</div>
        <div class="tag">${tag} · ${e.dur}秒</div>
      </div>
      <div class="ex-body">${e.tip}</div>
      <div class="ex-actions">
        ${vidBtn}
        <button class="btn sm ghost" onclick="startSingleEx(${dayIdx},'${pool}',${idx})">⏱ 计时</button>
      </div>
    </div>
  `;
}

function renderProgress(vp){
  if(!state.plan){
    vp.innerHTML = empty('还没有训练计划','定制一份计划，开始你的运动之旅吧');
    return;
  }
  const doneCount = Object.keys(state.done).length;
  const total = state.plan.totalDays;
  const pct = Math.round(doneCount/total*100);
  const circ = 2*Math.PI*90;
  const offset = circ * (1 - pct/100);
  const sp = getSportData(state.plan.sport, state.plan.subType);

  vp.innerHTML = `
    <svg style="display:none">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9e1722"/>
          <stop offset="100%" stop-color="#c08f24"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="progress-circle">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="90"></circle>
        <circle class="prog" cx="100" cy="100" r="90" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="center">
        <div class="pct">${pct}%</div>
        <div class="lbl">${doneCount}/${total} 天</div>
      </div>
    </div>

    <div class="card" style="text-align:center">
      <div style="font-size:36px">${state.streak}🔥</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">连续训练天数</div>
    </div>

    <div class="section-title">阶段里程碑</div>
    ${state.plan.stages.map((s,i)=>{
      const stageDays = state.plan.days.filter(d=>d.stage===i);
      const stageDone = stageDays.filter(d=>state.done[state.plan.days.indexOf(d)]).length;
      const done = stageDays.length>0 && stageDone===stageDays.length;
      return `
        <div class="milestone ${done?'done':''}">
          <div class="ic">${done?'🏆':'🎯'}</div>
          <div class="info">
            <h4>第${i+1}阶段：${s}</h4>
            <p>${getMilestones(state.plan.sport, state.plan.subType)[i]} · ${stageDone}/${stageDays.length}天</p>
          </div>
        </div>
      `;
    }).join('')}

    <div class="section-title">导师建议</div>
    <div class="card">
      <div style="font-size:30px;margin-bottom:10px">🧑‍🏫</div>
      <div style="font-size:14px;line-height:1.8;color:var(--muted)">${getAdvice()}</div>
      <button class="btn sm ghost" style="margin-top:12px" onclick="render()">换一条建议</button>
    </div>

    <div style="height:30px"></div>
  `;
}

function getAdvice(){
  const doneCount = Object.keys(state.done).length;
  const total = state.plan.totalDays;
  const pct = doneCount/total;
  if(pct===0) return '万事开头难，今天就是最好的开始。先从热身活动做起，感受身体的变化。';
  if(pct<0.3) return '已经起步了！保持每天训练的节奏，不要急于求成，身体需要适应过程。';
  if(pct<0.6) return '你已经进入状态了！注意观察身体反馈，适当调整训练强度，避免过度疲劳。';
  if(pct<0.9) return '距离目标不远了！继续保持，注意营养和睡眠，让恢复跟上训练节奏。';
  return '即将完成计划！回顾一下自己的进步，制定下一个目标，运动是终身的习惯。';
}

function renderMe(vp){
  vp.innerHTML = `
    <div class="section-title">提醒设置</div>
    <div class="card">
      <div class="toggle-row">
        <div>
          <div style="font-weight:600">每日锻炼提醒</div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">到点弹出通知，提醒你开始训练</div>
        </div>
        <div class="toggle ${state.notify?'on':''}" onclick="state.notify=!state.notify;save();render()"></div>
      </div>
      ${state.notify?`
        <div class="toggle-row" style="border:none">
          <div>
            <div style="font-weight:600">提醒时间</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">每天这个时间提醒你</div>
          </div>
          <input type="time" value="${state.notifyTime}" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:8px;font-family:inherit" onchange="state.notifyTime=this.value;save();startNotifyLoop()">
        </div>
      `:''}
    </div>

    <div class="section-title">当前计划</div>
    ${state.plan?`
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="font-size:36px">${getSportData(state.plan.sport, state.plan.subType).emoji}</div>
          <div style="flex:1">
            <div style="font-weight:600">${getSportData(state.plan.sport, state.plan.subType).name}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">${state.plan.totalDays}天 · 每天${state.plan.perDayMin}分钟</div>
          </div>
        </div>
      </div>
    `:'<div class="card" style="color:var(--muted);text-align:center">暂无计划</div>'}

    <div class="section-title">关于</div>
    <div class="card">
      <div style="font-size:13px;color:var(--muted);line-height:1.8">
        跃动运动技能自学计划<br>
        帮你科学入门各类运动项目<br>
        涵盖热身、主训练、拉伸全流程<br>
        每天坚持，遇见更好的自己 💪
      </div>
    </div>

    <div style="padding:14px 20px 40px">
      ${state.plan?`<button class="btn ghost block" onclick="resetPlan()">清空当前计划</button>`:''}
    </div>
  `;
}

function empty(title,desc){
  return `
    <div class="empty">
      <div class="emoji">🏃</div>
      <h3>${title}</h3>
      <p>${desc}</p>
      <button class="btn" style="margin-top:20px" onclick="switchTab('plan')">去定制</button>
    </div>
  `;
}

/* ==================== 操作 ==================== */
function quickSelect(key){
  state.currentSport = key;
  state.currentSubType = null;
  if(!state.plan){
    switchTab('plan');
  }else{
    // 切换运动项目
    if(confirm(`切换到 ${SPORTS[key].name} 会重新生成计划，当前进度会清除，确定吗？`)){
      state.currentSport = key;
      state.currentSubType = null;
      state.plan = null;
      state.done = {};
      save();
      switchTab('plan');
    }
  }
}

function createPlan(){
  const sport = state.currentSport || 'run';
  const sp = SPORTS[sport];
  const subType = sp.subTypes ? (state.currentSubType || Object.keys(sp.subTypes)[0]) : null;
  const days = parseInt($('#daysInput').value);
  const time = parseInt($('#timeInput').value);
  const config = {sport, subType, totalDays:days, perDayMin:time};
  state.config = config;
  state.plan = generatePlan(config);
  state.done = {};
  state.streak = 0;
  save();
  currentStageFilter = -1;
  toast('✅ 计划生成成功！');
  switchTab('home');
}

function resetPlan(){
  if(!confirm('确定要清空当前计划吗？所有进度将丢失。')) return;
  state.plan = null;
  state.done = {};
  state.config = null;
  currentStageFilter = -1;
  save();
  switchTab('plan');
}

function openVideo(sport, name){
  const sp = getSportData(sport, state.plan?.subType);
  const kw = `${sp.name} ${name}`;
  const url = `https://search.bilibili.com/all?keyword=${encodeURIComponent(kw)}&order=click`;
  window.open(url,'_blank');
}

/* ==================== 跟练计时器 ==================== */
let timerState = null;

function startFollow(dayIdxStr){
  const dayIdx = parseInt(dayIdxStr);
  const day = state.plan.days[dayIdx];
  // 构造序列：热身 → 体能 → 主训练 → 拉伸
  const seq = [];
  day.warmup.forEach(e=>seq.push({...e,type:'热身'}));
  if(day.fitness) day.fitness.forEach(e=>seq.push({...e,type:'体能'}));
  day.main.forEach(e=>seq.push({...e,type:'主训练'}));
  day.cooldown.forEach(e=>seq.push({...e,type:'拉伸'}));
  
  timerState = {
    dayIdx,
    seq,
    cur:0,
    remain:seq[0].dur,
    total:seq[0].dur,
    playing:true,
    interval:null
  };
  $('#timerModal').classList.add('show');
  renderTimer();
  startTick();
}

function startSingleEx(dayIdx, pool, idx){
  const day = state.plan.days[dayIdx];
  const e = pool==='w'?day.warmup[idx]:pool==='m'?day.main[idx]:pool==='c'?day.cooldown[idx]:day.fitness[idx];
  timerState = {
    dayIdx,
    seq:[{...e,type:'计时'}],
    cur:0,
    remain:e.dur,
    total:e.dur,
    playing:true,
    interval:null
  };
  $('#timerModal').classList.add('show');
  renderTimer();
  startTick();
}

function renderTimer(){
  const t = timerState;
  const e = t.seq[t.cur];
  $('#timerTime').textContent = formatTime(t.remain);
  $('#timerEx').textContent = `${e.type} · ${e.name}`;
  const pct = t.remain/t.total;
  $('#ringProg').style.strokeDashoffset = 628*(1-pct);
  $('#playBtn').textContent = t.playing?'⏸':'▶';
  
  // dots
  $('#timerDots').innerHTML = t.seq.map((ex,i)=>
    `<div class="timer-dot ${i<t.cur?'done':i===t.cur?'cur':''}"></div>`
  ).join('');
}

function startTick(){
  if(timerState.interval) clearInterval(timerState.interval);
  timerState.interval = setInterval(()=>{
    if(!timerState.playing) return;
    timerState.remain--;
    if(timerState.remain<=0){
      beep(800,.15);
      if(timerState.cur < timerState.seq.length-1){
        timerState.cur++;
        timerState.total = timerState.seq[timerState.cur].dur;
        timerState.remain = timerState.total;
        renderTimer();
      }else{
        // 全部完成
        clearInterval(timerState.interval);
        timerState.playing=false;
        finishDay(timerState.dayIdx);
      }
    }else{
      // 最后3秒提示
      if(timerState.remain<=3) beep(600,.08);
      $('#timerTime').textContent = formatTime(timerState.remain);
      const pct = timerState.remain/timerState.total;
      $('#ringProg').style.strokeDashoffset = 628*(1-pct);
    }
  },1000);
}

function togglePlay(){
  timerState.playing = !timerState.playing;
  $('#playBtn').textContent = timerState.playing?'⏸':'▶';
  startTick();
}

function prevEx(){
  if(timerState.cur>0){
    timerState.cur--;
    timerState.total = timerState.seq[timerState.cur].dur;
    timerState.remain = timerState.total;
    renderTimer();
  }
}

function nextEx(){
  if(timerState.cur<timerState.seq.length-1){
    timerState.cur++;
    timerState.total = timerState.seq[timerState.cur].dur;
    timerState.remain = timerState.total;
    renderTimer();
  }else{
    finishDay(timerState.dayIdx);
  }
}

function closeTimer(){
  if(timerState && timerState.interval) clearInterval(timerState.interval);
  $('#timerModal').classList.remove('show');
}

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// 提示音
let audioCtx;
function beep(freq,dur){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime+dur);
    osc.start();
    osc.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function finishDay(dayIdx){
  if(state.done[dayIdx]){
    closeTimer();
    return;
  }
  state.done[dayIdx] = true;
  
  // 连胜逻辑
  const today = new Date().toDateString();
  if(state.lastCheckIn !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    state.streak = state.lastCheckIn===yesterday ? state.streak+1 : 1;
    state.lastCheckIn = today;
  }
  save();
  closeTimer();
  confetti();
  toast(pickOne(CHEERS));
  
  // 检查阶段完成
  checkStageComplete(dayIdx);
  // 检查全部完成
  const allDone = Object.keys(state.done).length === state.plan.totalDays;
  if(allDone){
    setTimeout(()=>{
      alert('🎉 恭喜你完成全部训练计划！\n你已经在'+getSportData(state.plan.sport, state.plan.subType).name+'上迈出了坚实的一步，继续保持！');
    },500);
  }
  
  setTimeout(render, 800);
}

function checkStageComplete(dayIdx){
  const day = state.plan.days[dayIdx];
  const stageDays = state.plan.days.filter(d=>d.stage===day.stage);
  const stageDone = stageDays.filter(d=>state.done[state.plan.days.indexOf(d)]).length;
  if(stageDays.length>0 && stageDone===stageDays.length){
    setTimeout(()=>{
      alert('🏆 阶段完成提醒\n\n你已完成【'+day.stageName+'】阶段的所有训练！\n阶段任务：'+getMilestones(state.plan.sport, state.plan.subType)[day.stage]+'\n\n继续加油，向下一阶段进发！');
    },1200);
  }
}

function confetti(){
  const colors=['#ff6b35','#ffc233','#2ec4b6','#4cc9f0','#e71d36'];
  for(let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'%';
    c.style.top='-10px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animation=`fall ${1+Math.random()*2}s ease-out forwards`;
    c.style.animationDelay=Math.random()*0.3+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

/* ==================== 通知 ==================== */
let notifyLoopId;
function startNotifyLoop(){
  if(notifyLoopId) clearInterval(notifyLoopId);
  if(!state.notify) return;
  // 每分钟检查一次
  notifyLoopId = setInterval(()=>{
    const now = new Date();
    const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    if(hm === state.notifyTime && now.getSeconds()<2){
      sendNotify();
    }
  },15000);
}

async function sendNotify(){
  // 请求权限
  if(!('Notification' in window)){
    toast('到锻炼时间啦！');
    return;
  }
  let perm = Notification.permission;
  if(perm==='default'){
    perm = await Notification.requestPermission();
  }
  if(perm==='granted' && state.plan){
    const sp = getSportData(state.plan.sport, state.plan.subType);
    const nextDay = state.plan.days.find((d,i)=>!state.done[i]);
    const title = `💪 该锻炼啦！${sp.name}`;
    const body = nextDay ? `第${nextDay.day}天 · ${nextDay.stageName}\n${nextDay.main.length}个动作等你来` : '今天的计划已完成，休息一下吧~';
    try{
      new Notification(title,{body});
    }catch(e){
      toast(title+' '+body);
    }
  }else{
    toast('💪 到锻炼时间啦！');
  }
}

/* ==================== 初始化 ==================== */
$$('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// 加载时请求通知权限
if(state.notify && 'Notification' in window && Notification.permission==='default'){
  // 不立即请求，避免骚扰，在首次设置时请求
}

startNotifyLoop();
render();
</script>

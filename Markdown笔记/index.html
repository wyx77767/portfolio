<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 笔记 · 极简写作</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--orange:#d29922;--red:#f85149;--purple:#bc8cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.header h1{font-size:18px;display:flex;align-items:center;gap:8px}
.header h1 span{color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-left:auto}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;display:flex;align-items:center;gap:6px}
.btn:hover{background:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.main{flex:1;display:flex;overflow:hidden}
/* 侧边栏 */
.sidebar{width:260px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.note-list{flex:1;overflow-y:auto;padding:8px}
.note-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:.2s;border:1px solid transparent}
.note-item:hover{background:var(--border)}
.note-item.active{background:var(--border);border-color:var(--accent)}
.note-title{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-time{font-size:11px;color:var(--muted);margin-top:4px}
/* 编辑器区域 */
.editor-area{flex:1;display:flex;flex-direction:column}
.editor-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.editor-title-input{flex:1;background:transparent;border:none;color:var(--text);font-size:18px;font-weight:600;outline:none}
.editor-title-input::placeholder{color:var(--muted)}
.editor-meta{font-size:12px;color:var(--muted)}
.editor-body{flex:1;display:flex;overflow:hidden}
.editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
.editor-pane:last-child{border-right:none}
.pane-header{padding:8px 16px;font-size:12px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pane-content{flex:1;overflow:auto;padding:16px}
#editor{width:100%;height:100%;background:transparent;border:none;color:var(--text);font-family:"Cascadia Code","Fira Code",monospace;font-size:14px;line-height:1.7;resize:none;outline:none}
#preview{font-size:15px;line-height:1.8}
#preview h1,#preview h2,#preview h3,#preview h4{margin-top:24px;margin-bottom:12px;color:var(--text)}
#preview h1{font-size:28px;border-bottom:1px solid var(--border);padding-bottom:8px}
#preview h2{font-size:22px}#preview h3{font-size:18px}
#preview p{margin-bottom:12px}
#preview code{background:var(--panel);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px;color:var(--orange)}
#preview pre{background:var(--panel);padding:16px;border-radius:8px;overflow-x:auto;margin:12px 0}
#preview pre code{background:none;padding:0;color:var(--text)}
#preview ul,#preview ol{margin:12px 0;padding-left:24px}
#preview li{margin-bottom:4px}
#preview blockquote{border-left:3px solid var(--accent);padding-left:16px;margin:12px 0;color:var(--muted)}
#preview a{color:var(--accent);text-decoration:none}
#preview table{border-collapse:collapse;width:100%;margin:12px 0}
#preview th,#preview td{border:1px solid var(--border);padding:8px 12px;text-align:left}
#preview th{background:var(--panel)}
#preview img{max-width:100%;border-radius:8px}
#preview hr{border:none;border-top:1px solid var(--border);margin:20px 0}
#preview strong{color:var(--text)}
#preview em{color:var(--muted)}
/* 状态栏 */
.status-bar{background:var(--panel);border-top:1px solid var(--border);padding:8px 20px;font-size:12px;color:var(--muted);display:flex;gap:20px;flex-shrink:0}
.status-bar span{display:flex;align-items:center;gap:4px}
/* 空状态 */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:16px}
.empty-state .icon{font-size:48px}
/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
@media(max-width:768px){.sidebar{display:none}.editor-body{flex-direction:column}.editor-pane{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="header">
  <h1>📝 <span>Markdown</span> 笔记</h1>
  <div class="toolbar">
    <button class="btn" onclick="newNote()">+ 新建</button>
    <button class="btn" onclick="saveNote()">💾 保存</button>
    <button class="btn" onclick="deleteNote()">🗑 删除</button>
    <button class="btn primary" onclick="exportNote()">📤 导出</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header"><h2>笔记列表</h2><span id="noteCount" style="font-size:12px;color:var(--muted)">0 篇</span></div>
    <div class="note-list" id="noteList"></div>
  </div>

  <div class="editor-area" id="editorArea" style="display:none">
    <div class="editor-header">
      <input type="text" class="editor-title-input" id="noteTitle" placeholder="输入标题...">
      <span class="editor-meta" id="wordCount">0 字</span>
    </div>
    <div class="editor-body">
      <div class="editor-pane">
        <div class="pane-header">✏️ 编辑</div>
        <div class="pane-content"><textarea id="editor" placeholder="开始用 Markdown 写作..." oninput="renderPreview();updateWordCount();"></textarea></div>
      </div>
      <div class="editor-pane">
        <div class="pane-header">👁 预览</div>
        <div class="pane-content" id="preview"></div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="icon">📝</div>
    <p>选择左侧笔记开始编辑，或新建一篇</p>
    <button class="btn primary" onclick="newNote()">+ 新建笔记</button>
  </div>
</div>

<div class="status-bar">
  <span>💾 自动保存到本地</span>
  <span id="saveStatus">已保存</span>
  <span style="margin-left:auto">Markdown 语法高亮预览</span>
</div>

<script>
let notes=[],currentId=null,saveTimer=null;
function init(){loadNotes();renderNoteList();}
function loadNotes(){const s=localStorage.getItem('markdownNotes');if(s)notes=JSON.parse(s);}
function saveNotes(){localStorage.setItem('markdownNotes',JSON.stringify(notes));document.getElementById('saveStatus').textContent='已保存';setTimeout(()=>document.getElementById('saveStatus').textContent='已保存',1000);}
function renderNoteList(){const list=document.getElementById('noteList');document.getElementById('noteCount').textContent=notes.length+' 篇';list.innerHTML=notes.map(n=>`<div class="note-item ${n.id===currentId?'active':''}" onclick="selectNote(${n.id})"><div class="note-title">${escapeHtml(n.title||'无标题')}</div><div class="note-preview">${escapeHtml(n.content.slice(0,50)||'暂无内容')}</div><div class="note-time">${new Date(n.updated).toLocaleString('zh-CN')}</div></div>`).join('');}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function newNote(){const id=Date.now();notes.unshift({id,title:'',content:'# 新笔记\n\n开始写作...',created:new Date().toISOString(),updated:new Date().toISOString()});currentId=id;saveNotes();renderNoteList();showEditor();loadNote();}
function selectNote(id){currentId=id;renderNoteList();showEditor();loadNote();}
function showEditor(){document.getElementById('editorArea').style.display='flex';document.getElementById('emptyState').style.display='none';}
function loadNote(){const n=notes.find(n=>n.id===currentId);if(!n)return;document.getElementById('noteTitle').value=n.title;document.getElementById('editor').value=n.content;renderPreview();updateWordCount();}
function saveNote(){const n=notes.find(n=>n.id===currentId);if(!n)return;n.title=document.getElementById('noteTitle').value;n.content=document.getElementById('editor').value;n.updated=new Date().toISOString();saveNotes();renderNoteList();}
function autoSave(){clearTimeout(saveTimer);document.getElementById('saveStatus').textContent='保存中...';saveTimer=setTimeout(saveNote,1000);}
function deleteNote(){if(!currentId)return;if(!confirm('确定删除这篇笔记吗？'))return;notes=notes.filter(n=>n.id!==currentId);currentId=notes[0]?.id||null;saveNotes();renderNoteList();if(currentId){loadNote();}else{document.getElementById('editorArea').style.display='none';document.getElementById('emptyState').style.display='flex';}}
function exportNote(){const n=notes.find(n=>n.id===currentId);if(!n)return;const blob=new Blob([n.content],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(n.title||'笔记')+'.md';a.click();}
function updateWordCount(){const text=document.getElementById('editor').value;const words=text.replace(/\s/g,'').length;document.getElementById('wordCount').textContent=words+' 字';autoSave();}
// 简易 Markdown 渲染
function renderPreview(){const text=document.getElementById('editor').value;let html=escapeHtml(text);
html=html.replace(/^#### (.*$)/gim,'<h4>$1</h4>').replace(/^### (.*$)/gim,'<h3>$1</h3>').replace(/^## (.*$)/gim,'<h2>$1</h2>').replace(/^# (.*$)/gim,'<h1>$1</h1>');
html=html.replace(/\*\*\*(.*?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>');
html=html.replace(/`([^`]+)`/g,'<code>$1</code>');
html=html.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){return '<pre><code>'+code.trim()+'</code></pre>';});
html=html.replace(/^&gt; (.*$)/gim,'<blockquote>$1</blockquote>');
html=html.replace(/^\* (.*$)/gim,'<li>$1</li>').replace(/^- (.*$)/gim,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>');
html=html.replace(/^\d+\. (.*$)/gim,'<li>$1</li>');
html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
html=html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
html=html.replace(/^---$/gim,'<hr>');
html=html.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
html='<p>'+html+'</p>';
html=html.replace(/<p><\/p>/g,'').replace(/<p>(<h[1-4]>)/g,'$1').replace(/(<\/h[1-4]>)<\/p>/g,'$1').replace(/<p>(<ul>)/g,'$1').replace(/(<\/ul>)<\/p>/g,'$1').replace(/<p>(<blockquote>)/g,'$1').replace(/(<\/blockquote>)<\/p>/g,'$1').replace(/<p>(<pre>)/g,'$1').replace(/(<\/pre>)<\/p>/g,'$1').replace(/<p>(<hr>)<\/p>/g,'$1');
document.getElementById('preview').innerHTML=html;}
// 标题输入监听
document.getElementById('noteTitle').addEventListener('input',autoSave);
init();
</script>
</body>
</html>

// 根据身体数据计算体型参数（空值用默认值兜底，避免输入过程中 NaN/Infinity）
function calcBodyShape(body) {
  const h = Number(body.height) || 165;
  const w = Number(body.weight) || 52;
  const bust = Number(body.bust) || 86, waist = Number(body.waist) || 68;
  const shoulder = Number(body.shoulder) || 38, hip = Number(body.hip) || 92;
  const bmi = w / Math.pow(h/100, 2);
  // slim: <20, normal: 20-24, curvy: 24-28, plus: >28
  let type = 'normal';
  if (bmi < 20) type = 'slim';
  else if (bmi < 24) type = 'normal';
  else if (bmi < 28) type = 'curvy';
  else type = 'plus';
  // 肩宽指数
  const shoulderRatio = shoulder / hip;
  // 腰臀比
  const whr = waist / hip;
  return { type, bmi, shoulderRatio, whr, legRatio: Number(body.legRatio) || 0.5 };
}

/* ============================================================
   Canvas 2D 形象渲染器：OOP + 锚点数据驱动
   身材参数 → 关节锚点，衣服始终读取最新锚点绘制 → 实时贴合
============================================================ */
class AvatarRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.LW = 400; this.LH = 600; // 逻辑坐标系
    this.profile = {}; this.outfit = null; this.view = 'front';
    this._raf = 0;
    this._onResize = this._onResize.bind(this);
    this._ro = new ResizeObserver(this._onResize);
    this._ro.observe(canvas);
    this._onResize();
  }

  update(opts) {
    this.profile = opts.profile || {};
    this.outfit = opts.showClothes === false ? null : (opts.outfit || null);
    this.view = opts.view || 'front';
    // 同步重绘：不依赖 rAF（后台标签页 / 部分无头环境会冻结 rAF）
    this._draw();
  }

  destroy() { cancelAnimationFrame(this._raf); this._ro.disconnect(); }

  _onResize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = this.canvas.getBoundingClientRect();
    const w = rect.width || this.LW, h = rect.height || this.LH;
    this.canvas.width = Math.round(w * dpr);
    this.canvas.height = Math.round(h * dpr);
    this._dpr = dpr; this._cssW = w; this._cssH = h;
    this._draw();
  }

  // ---------- 锚点：身材数据（身高/体重/三围/腿长 + 微调系数）→ 关节坐标 ----------
  _computeAnchors() {
    const b = this.profile?.body || {}, a = this.profile?.avatar || {};
    const n = (v, d) => { const x = Number(v); return Number.isFinite(x) && x > 0 ? x : d; };
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    const height = n(b.height, 165), weight = n(b.weight, 52);
    const bmi = weight / Math.pow(height / 100, 2);
    const wf = clamp(0.82 + (bmi - 19) * 0.05, 0.78, 1.35);          // 胖瘦
    const s = (height / 165) * n(a.heightScale, 1);                // 身高比例
    const legRatio = clamp(n(b.legRatio, 0.5), 0.4, 0.6);

    const cx = this.LW / 2;
    const headR = 30 * n(a.faceWidth, 1);
    const headCY = 26 + headR;
    const neckY = headCY + headR * 0.95;
    const shoulderY = neckY + 18 * s + 4;
    const bustY = shoulderY + 32 * s;
    const waistY = shoulderY + 76 * s;
    const hipY = shoulderY + 116 * s;
    const crotchY = hipY + 8 * s;
    const legLen = 168 * s * (0.88 + legRatio * 0.24);
    const kneeY = crotchY + legLen * 0.52;
    const feetY = crotchY + legLen;
    const elbowY = shoulderY + 62 * s;
    const wristY = shoulderY + 118 * s;

    const sh = 58 * (n(b.shoulder, 38) / 38) * wf * n(a.shoulderScale, 1);
    const bu = 44 * (n(b.bust, 86) / 86) * wf;
    const wa = 32 * (n(b.waist, 68) / 68) * wf * n(a.waistScale, 1);
    const hp = 45 * (n(b.hip, 92) / 92) * wf;

    return {
      cx, s, wf, headR, headCY, neckY, shoulderY, bustY, waistY, hipY,
      crotchY, kneeY, feetY, elbowY, wristY,
      sh, bu, wa, hp,
      thigh: 14.5 * wf, calf: 9.5 * wf, ankle: 7 * wf,
      armTop: 9.5 * wf, armBot: 6.5 * wf,
      eyeSize: n(a.eyeSize, 1), mouthWidth: n(a.mouthWidth, 1),
      skin: b.skinTone || '#E8C4A0',
      skinDark: shadeColor(b.skinTone || '#E8C4A0', -22),
      hair: a.hairColor || '#2C1810',
    };
  }

  _draw() {
    const ctx = this.ctx;
    if (!this._dpr || !this.profile) return;
    try {
    // 等比缩放并居中，容器比例变化时人物不变形
    const scale = Math.min(this._cssW / this.LW, this._cssH / this.LH);
    const offX = (this._cssW - this.LW * scale) / 2;
    const offY = (this._cssH - this.LH * scale) / 2;
    ctx.setTransform(this._dpr * scale, 0, 0, this._dpr * scale, this._dpr * offX, this._dpr * offY);
    ctx.clearRect(-offX / scale, -offY / scale, this._cssW / scale, this._cssH / scale);

    const a = this.profile?.avatar || {};
    const A = this._computeAnchors();
    this.A = A;
    this.sideView = this.view === 'side';
    this.backView = this.view === 'back';

    ctx.save();
    if (this.sideView) { ctx.translate(A.cx, 0); ctx.scale(0.42, 1); ctx.translate(-A.cx, 0); }

    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    ctx.beginPath(); ctx.ellipse(A.cx, A.feetY + 10, 62, 8, 0, 0, Math.PI * 2); ctx.fill();

    // 后层头发（垂在背后）
    this._drawBackHair(ctx, A, a);
    // 腿 / 下装
    if (this.outfit?.bottom && ['jeans','trousers'].includes(this.outfit.bottom.shape)) this._drawPants(ctx, A, this.outfit.bottom);
    else this._drawLegs(ctx, A);
    if (this.outfit?.bottom && this.outfit.bottom.shape === 'shorts') this._drawShorts(ctx, A, this.outfit.bottom);
    if (this.outfit?.bottom && this.outfit.bottom.shape === 'skirt') this._drawSkirt(ctx, A, this.outfit.bottom);
    // 鞋
    if (this.outfit?.shoes) this._drawShoes(ctx, A, this.outfit.shoes);
    else this._drawFeet(ctx, A);
    // 躯干
    this._drawTorso(ctx, A);
    // 上衣
    if (this.outfit?.top) this._drawTop(ctx, A, this.outfit.top);
    // 手臂（先画，领口/外套可压住肩部）
    this._drawArms(ctx, A, this.outfit);
    // 外套
    if (this.outfit?.outerwear) this._drawOuterwear(ctx, A, this.outfit.outerwear);
    // 脖子 + 头
    this._drawNeck(ctx, A);
    this._drawHead(ctx, A, a);
    if (!this.backView) this._drawFace(ctx, A, a);
    this._drawFrontHair(ctx, A, a);
    // 配饰
    (this.outfit?.accessories || []).forEach((acc) => this._drawAccessory(ctx, A, acc));

    ctx.restore();
    } catch (err) { if (ctx) { ctx.restore?.(); } }
  }

  // ---------- 身体 ----------
  _legPath(ctx, A, side) {
    const { cx, crotchY, kneeY, feetY, thigh, calf, ankle } = A;
    ctx.beginPath();
    ctx.moveTo(cx + side * 7, crotchY - 2);
    ctx.quadraticCurveTo(cx + side * thigh, kneeY - 2, cx + side * (ankle + 2), feetY - 6);
    ctx.lineTo(cx + side * 2, feetY - 6);
    ctx.quadraticCurveTo(cx + side * 5, kneeY, cx + side * 3, crotchY - 2);
    ctx.closePath();
  }

  _drawLegs(ctx, A) {
    ctx.fillStyle = A.skin;
    this._legPath(ctx, A, -1); ctx.fill();
    this._legPath(ctx, A, 1); ctx.fill();
  }

  _drawFeet(ctx, A) {
    ctx.fillStyle = A.skinDark;
    [-1, 1].forEach((s) => {
      ctx.beginPath();
      ctx.ellipse(A.cx + s * 9, A.feetY - 2, 11, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  _drawTorso(ctx, A) {
    const { cx, sh, bu, wa, hp, shoulderY, bustY, waistY, hipY } = A;
    ctx.fillStyle = A.skin;
    ctx.beginPath();
    ctx.moveTo(cx - sh, shoulderY);
    ctx.bezierCurveTo(cx - sh - 2, shoulderY + 22, cx - bu - 2, bustY + 2, cx - bu, bustY);
    ctx.quadraticCurveTo(cx - wa - 2, (bustY + waistY) / 2, cx - wa, waistY);
    ctx.quadraticCurveTo(cx - hp, waistY + 20, cx - hp, hipY);
    ctx.lineTo(cx + hp, hipY);
    ctx.quadraticCurveTo(cx + hp, waistY + 20, cx + wa, waistY);
    ctx.quadraticCurveTo(cx + bu + 2, (bustY + waistY) / 2, cx + bu, bustY);
    ctx.bezierCurveTo(cx + bu + 2, bustY + 2, cx + sh + 2, shoulderY + 22, cx + sh, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - 10, cx - sh, shoulderY);
    ctx.closePath();
    ctx.fill();
    // 身体侧影（柔和暗面）
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.beginPath();
    ctx.moveTo(cx - sh, shoulderY);
    ctx.bezierCurveTo(cx - sh - 2, shoulderY + 22, cx - bu - 2, bustY + 2, cx - bu, bustY);
    ctx.quadraticCurveTo(cx - wa - 2, (bustY + waistY) / 2, cx - wa, waistY);
    ctx.quadraticCurveTo(cx - hp, waistY + 20, cx - hp, hipY);
    ctx.lineTo(cx - hp + 8, hipY);
    ctx.quadraticCurveTo(cx - wa + 4, waistY + 16, cx - wa + 5, waistY);
    ctx.quadraticCurveTo(cx - bu + 3, (bustY + waistY) / 2, cx - bu + 6, bustY);
    ctx.bezierCurveTo(cx - sh + 8, shoulderY + 20, cx - sh + 6, shoulderY + 6, cx - sh, shoulderY);
    ctx.closePath(); ctx.fill();
  }

  _armPath(ctx, A, side) {
    const { cx, sh, shoulderY, elbowY, wristY, armTop, armBot } = A;
    ctx.beginPath();
    ctx.moveTo(cx + side * (sh - 2), shoulderY + 2);
    ctx.bezierCurveTo(cx + side * (sh + 7), shoulderY + 26, cx + side * (sh + 4), elbowY, cx + side * (sh - 1), wristY);
    ctx.lineTo(cx + side * (sh - armBot * 2 - 1), wristY);
    ctx.bezierCurveTo(cx + side * (sh - armTop * 1.6), elbowY, cx + side * (sh - armTop * 1.4), shoulderY + 16, cx + side * (sh - 12), shoulderY + 10);
    ctx.closePath();
  }

  _drawArms(ctx, A, outfit) {
    const top = outfit?.top, outer = outfit?.outerwear;
    const longSleeve = outer || top?.shape === 'sweater';
    const sleeveColor = outer ? outer.color : top?.color;
    [-1, 1].forEach((side) => {
      // 整条手臂（肤色或长袖）
      ctx.fillStyle = longSleeve ? sleeveColor : A.skin;
      this._armPath(ctx, A, side); ctx.fill();
      // 短袖袖管
      if (!longSleeve && top && (top.shape === 'tshirt' || top.shape === 'shirt')) {
        const { cx, sh, shoulderY } = A;
        ctx.fillStyle = top.color;
        ctx.beginPath();
        ctx.moveTo(cx + side * (sh - 6), shoulderY);
        ctx.lineTo(cx + side * (sh + 11), shoulderY + 6);
        ctx.lineTo(cx + side * (sh + 9), shoulderY + 30);
        ctx.lineTo(cx + side * (sh - 4), shoulderY + 26);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = shadeColor(top.color, -18); ctx.lineWidth = 1.2; ctx.stroke();
      }
      // 手
      ctx.fillStyle = A.skin;
      ctx.beginPath();
      ctx.ellipse(A.cx + side * (A.sh - 4), A.wristY + 4, 7.5, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  _drawNeck(ctx, A) {
    ctx.fillStyle = A.skin;
    ctx.beginPath();
    ctx.moveTo(A.cx - 8, A.neckY - 4);
    ctx.lineTo(A.cx - 9, A.shoulderY + 6);
    ctx.quadraticCurveTo(A.cx, A.shoulderY + 12, A.cx + 9, A.shoulderY + 6);
    ctx.lineTo(A.cx + 8, A.neckY - 4);
    ctx.closePath(); ctx.fill();
  }

  // ---------- 头部 ----------
  _drawHead(ctx, A, a) {
    const { cx, headCY: cy, headR: R } = A;
    const fs = a.faceShape || 'oval';
    const rx = R * (fs === 'round' ? 0.9 : fs === 'square' ? 0.82 : 0.8);
    const ry = R * (fs === 'round' ? 0.92 : fs === 'long' ? 1.16 : fs === 'square' ? 0.96 : 1.04);
    // 耳朵
    ctx.fillStyle = A.skinDark;
    [-1, 1].forEach((s) => {
      ctx.beginPath(); ctx.ellipse(cx + s * rx * 0.98, cy - 2, 3.6, 7, 0, 0, Math.PI * 2); ctx.fill();
    });
    // 脸
    ctx.fillStyle = A.skin;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    if (fs === 'square') {
      ctx.fillRect(cx - rx * 0.92, cy + ry * 0.55, rx * 1.84, ry * 0.4);
    }
  }

  _drawFace(ctx, A, a) {
    const { cx, headCY: cy, headR: R, eyeSize: es, mouthWidth: mw } = A;
    const side = this.sideView;
    const eyeY = cy - 3, offX = side ? 0 : R * 0.36;
    const eyeR = 4.4 * es;
    const eyeColor = a.eyeColor || '#3D2314';

    const drawEye = (x) => {
      const shape = a.eyeShape || 'almond';
      ctx.fillStyle = eyeColor;
      ctx.beginPath();
      if (shape === 'round') { ctx.arc(x, eyeY, eyeR, 0, Math.PI * 2); ctx.fill(); }
      else if (shape === 'wide') { ctx.ellipse(x, eyeY, eyeR * 1.25, eyeR * 0.85, 0, 0, Math.PI * 2); ctx.fill(); }
      else if (shape === 'cat') {
        ctx.moveTo(x - eyeR * 1.4, eyeY + 1.5);
        ctx.lineTo(x + eyeR * 1.3, eyeY - 2); ctx.lineTo(x - eyeR * 1.4, eyeY - 2);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.ellipse(x, eyeY, eyeR * 1.25, eyeR * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      }
      // 高光
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x + eyeR * 0.4, eyeY - eyeR * 0.35, eyeR * 0.28, 0, Math.PI * 2); ctx.fill();
    };
    if (side) drawEye(cx + 2); else { drawEye(cx - offX); drawEye(cx + offX); }

    // 眉毛
    ctx.strokeStyle = A.hair; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    if (side) {
      ctx.beginPath(); ctx.moveTo(cx - 5, eyeY - 9); ctx.quadraticCurveTo(cx + 2, eyeY - 11, cx + 7, eyeY - 9); ctx.stroke();
    } else {
      [-1, 1].forEach((s) => {
        const tilt = a.eyeShape === 'cat' ? s * 2 : 0;
        ctx.beginPath();
        ctx.moveTo(cx + s * offX - 6, eyeY - 8 + tilt);
        ctx.quadraticCurveTo(cx + s * offX, eyeY - 11, cx + s * offX + 6, eyeY - 8 - tilt);
        ctx.stroke();
      });
    }

    // 鼻
    ctx.strokeStyle = A.skinDark; ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (side) { ctx.moveTo(cx + 6, eyeY + 3); ctx.quadraticCurveTo(cx + 9, eyeY + 9, cx + 5, eyeY + 12); }
    else { ctx.moveTo(cx, eyeY + 4); ctx.quadraticCurveTo(cx - 2, eyeY + 10, cx + 1, eyeY + 13); }
    ctx.stroke();

    // 嘴
    const mouthY = cy + R * 0.42, w = 9 * mw;
    ctx.strokeStyle = '#B05750'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (side) { ctx.moveTo(cx - 2, mouthY); ctx.quadraticCurveTo(cx + 5, mouthY + 3, cx + 9, mouthY); }
    else { ctx.moveTo(cx - w, mouthY); ctx.quadraticCurveTo(cx, mouthY + 4, cx + w, mouthY); }
    ctx.stroke();

    // 腮红
    if (!side) {
      ctx.fillStyle = 'rgba(240,150,150,0.35)';
      [-1, 1].forEach((s) => {
        ctx.beginPath(); ctx.ellipse(cx + s * R * 0.55, mouthY - 6, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
      });
    }
  }

  // ---------- 头发 ----------
  _hairCapPath(ctx, A) {
    const { cx, headCY: cy, headR: R } = A;
    ctx.beginPath();
    ctx.moveTo(cx - R * 0.85, cy - R * 0.1);
    ctx.bezierCurveTo(cx - R * 0.9, cy - R * 1.25, cx + R * 0.9, cy - R * 1.25, cx + R * 0.85, cy - R * 0.1);
    ctx.quadraticCurveTo(cx, cy - R * 0.55, cx - R * 0.85, cy - R * 0.1);
    ctx.closePath();
  }

  _drawBackHair(ctx, A, a) {
    const style = a.hairStyle || 'long';
    if (!['long','bob','curly','ponytail'].includes(style)) return;
    const { cx, headCY: cy, headR: R } = A;
    ctx.fillStyle = A.hair;
    if (style === 'long') {
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.8, cy - R * 0.2);
      ctx.bezierCurveTo(cx - R * 1.15, cy + R * 1.2, cx - R * 1.05, A.shoulderY + 30, cx - R * 0.7, A.shoulderY + 34);
      ctx.quadraticCurveTo(cx, A.shoulderY + 20, cx + R * 0.7, A.shoulderY + 34);
      ctx.bezierCurveTo(cx + R * 1.05, A.shoulderY + 30, cx + R * 1.15, cy + R * 1.2, cx + R * 0.8, cy - R * 0.2);
      ctx.quadraticCurveTo(cx, cy - R * 1.1, cx - R * 0.8, cy - R * 0.2);
      ctx.closePath(); ctx.fill();
    } else if (style === 'bob') {
      ctx.beginPath();
      ctx.ellipse(cx, cy + R * 0.1, R * 1.02, R * 1.25, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (style === 'curly') {
      for (let i = 0; i < 10; i++) {
        const ang = Math.PI * (0.15 + i * 0.078);
        const bx = cx + Math.cos(ang) * R * 0.95 * (i < 5 ? -1 : 1);
        const by = cy + R * 0.2 + (i % 3) * R * 0.22;
        ctx.beginPath(); ctx.arc(bx, by, R * 0.26, 0, Math.PI * 2); ctx.fill();
      }
    } else if (style === 'ponytail') {
      ctx.beginPath();
      ctx.moveTo(cx + R * 0.4, cy - R * 0.7);
      ctx.bezierCurveTo(cx + R * 1.5, cy, cx + R * 1.35, cy + R * 1.5, cx + R * 0.9, cy + R * 1.9);
      ctx.quadraticCurveTo(cx + R * 0.6, cy + R * 1.2, cx + R * 0.5, cy - R * 0.2);
      ctx.closePath(); ctx.fill();
    }
  }

  _drawFrontHair(ctx, A, a) {
    const style = a.hairStyle || 'long';
    const { cx, headCY: cy, headR: R } = A;
    ctx.fillStyle = A.hair;
    this._hairCapPath(ctx, A); ctx.fill();
    // 刘海侧鬓
    if (['long','bob','short'].includes(style)) {
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.85, cy - R * 0.05);
      ctx.quadraticCurveTo(cx - R * 0.95, cy + R * 0.5, cx - R * 0.72, cy + R * (style === 'short' ? 0.35 : 0.75));
      ctx.quadraticCurveTo(cx - R * 0.55, cy + R * 0.2, cx - R * 0.6, cy - R * 0.3);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + R * 0.85, cy - R * 0.05);
      ctx.quadraticCurveTo(cx + R * 0.95, cy + R * 0.5, cx + R * 0.72, cy + R * (style === 'short' ? 0.35 : 0.75));
      ctx.quadraticCurveTo(cx + R * 0.55, cy + R * 0.2, cx + R * 0.6, cy - R * 0.3);
      ctx.closePath(); ctx.fill();
    }
    if (style === 'curly') {
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(cx - R * 0.75 + i * R * 0.3, cy - R * 0.85 + (i % 2) * 3, R * 0.24, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- 服装（全部读取锚点坐标绘制）----------
  _fillStroke(ctx, color, dark = true) {
    ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = dark ? shadeColor(color, -20) : 'rgba(0,0,0,0.15)';
    ctx.stroke();
  }

  _drawTop(ctx, A, item) {
    const { cx, sh, bu, wa, shoulderY, bustY, waistY, hipY } = A;
    const c = item.color, dk = shadeColor(c, -20);
    ctx.save();
    ctx.beginPath();
    if (item.shape === 'tank') {
      // 吊带背心：窄肩带 + 合身衣身
      ctx.moveTo(cx - bu + 4, shoulderY + 4);
      ctx.lineTo(cx - wa, waistY + 8);
      ctx.quadraticCurveTo(cx, waistY + 12, cx + wa, waistY + 8);
      ctx.lineTo(cx + bu - 4, shoulderY + 4);
      ctx.quadraticCurveTo(cx, shoulderY - 2, cx - bu + 4, shoulderY + 4);
      this._fillStroke(ctx, c);
      ctx.strokeStyle = dk; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - bu + 8, shoulderY + 2); ctx.lineTo(cx - bu + 14, shoulderY - 6);
      ctx.moveTo(cx + bu - 8, shoulderY + 2); ctx.lineTo(cx + bu - 14, shoulderY - 6);
      ctx.stroke();
    } else if (item.shape === 'sweater') {
      // 毛衣：长袖 + 宽松衣身到臀
      const hem = hipY - 6;
      ctx.moveTo(cx - 14, shoulderY - 2);
      ctx.lineTo(cx - sh - 4, shoulderY + 2);
      ctx.lineTo(cx - sh - 7, A.wristY + 2);
      ctx.lineTo(cx - sh + 7, A.wristY + 2);
      ctx.lineTo(cx - sh + 4, shoulderY + 18);
      ctx.lineTo(cx - wa - 4, hem);
      ctx.quadraticCurveTo(cx, hem + 5, cx + wa + 4, hem);
      ctx.lineTo(cx + sh - 4, shoulderY + 18);
      ctx.lineTo(cx + sh - 7, A.wristY + 2);
      ctx.lineTo(cx + sh + 7, A.wristY + 2);
      ctx.lineTo(cx + sh + 4, shoulderY + 2);
      ctx.lineTo(cx + 14, shoulderY - 2);
      ctx.quadraticCurveTo(cx, shoulderY + 10, cx - 14, shoulderY - 2);
      this._fillStroke(ctx, c);
      // 罗纹
      ctx.strokeStyle = dk; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath(); ctx.moveTo(cx + i * 6, hem - 8); ctx.lineTo(cx + i * 6, hem); ctx.stroke();
      }
    } else {
      // tshirt / shirt：短袖 + 衣身到腰下
      const hem = waistY + (item.shape === 'shirt' ? 10 : 6);
      ctx.moveTo(cx - 13, shoulderY - 2);
      ctx.lineTo(cx - sh, shoulderY);
      ctx.lineTo(cx - sh - 12, shoulderY + 26);
      ctx.lineTo(cx - sh - 3, shoulderY + 29);
      ctx.lineTo(cx - bu, bustY + 2);
      ctx.lineTo(cx - wa, hem);
      ctx.quadraticCurveTo(cx, hem + 4, cx + wa, hem);
      ctx.lineTo(cx + bu, bustY + 2);
      ctx.lineTo(cx + sh - 3, shoulderY + 29);
      ctx.lineTo(cx + sh + 12, shoulderY + 26);
      ctx.lineTo(cx + sh, shoulderY);
      ctx.lineTo(cx + 13, shoulderY - 2);
      ctx.quadraticCurveTo(cx, shoulderY + 8, cx - 13, shoulderY - 2);
      this._fillStroke(ctx, c);
      // 衬衫领
      if (item.shape === 'shirt') {
        ctx.strokeStyle = dk; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(cx - 13, shoulderY - 1); ctx.lineTo(cx, shoulderY + 14); ctx.lineTo(cx + 13, shoulderY - 1);
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, shoulderY + 14); ctx.lineTo(cx, hem - 10); ctx.stroke();
      }
    }
    ctx.restore();
  }

  _drawOuterwear(ctx, A, item) {
    const { cx, sh, wa, shoulderY, waistY, hipY, kneeY, wristY } = A;
    const lenMap = { blazer: hipY + 6, coat: kneeY + 14, jacket: hipY - 14, cardigan: hipY + 2 };
    const hem = lenMap[item.shape] || hipY;
    const pad = item.shape === 'coat' ? 8 : 5;
    const c = item.color, dk = shadeColor(c, -22);
    ctx.save();
    ctx.globalAlpha = item.shape === 'cardigan' ? 0.92 : 0.97;
    // 长袖外套主体（开襟 V 领）
    ctx.beginPath();
    ctx.moveTo(cx - sh - pad, shoulderY);
    ctx.lineTo(cx - sh - pad - 5, wristY);
    ctx.lineTo(cx - sh - pad + 8, wristY);
    ctx.lineTo(cx - sh + 2, shoulderY + 20);
    ctx.lineTo(cx - 6, hem);
    ctx.lineTo(cx + 6, hem);
    ctx.lineTo(cx + sh - 2, shoulderY + 20);
    ctx.lineTo(cx + sh + pad - 8, wristY);
    ctx.lineTo(cx + sh + pad + 5, wristY);
    ctx.lineTo(cx + sh + pad, shoulderY);
    ctx.quadraticCurveTo(cx, shoulderY - 8, cx - sh - pad, shoulderY);
    this._fillStroke(ctx, c);
    // 翻领 / 开襟线
    ctx.strokeStyle = dk; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(cx - 12, shoulderY); ctx.lineTo(cx, shoulderY + 26); ctx.lineTo(cx - 5, shoulderY + 52);
    ctx.moveTo(cx + 12, shoulderY); ctx.lineTo(cx, shoulderY + 26); ctx.lineTo(cx + 5, shoulderY + 52);
    ctx.moveTo(cx, shoulderY + 26); ctx.lineTo(cx, hem - 4);
    ctx.stroke();
    if (item.shape === 'jacket') {
      ctx.fillStyle = dk;
      ctx.fillRect(cx - wa - 4, hem - 7, wa * 2 + 8, 5);
    }
    ctx.restore();
  }

  _drawPants(ctx, A, item) {
    const { cx, wa, hp, waistY, crotchY, kneeY, feetY, thigh, calf, ankle } = A;
    const c = item.color, dk = shadeColor(c, -20);
    const long = item.shape !== 'shorts';
    const endY = long ? feetY - 4 : crotchY + (kneeY - crotchY) * 0.62;
    const bottomHalf = long ? ankle + 2 : calf + 1;
    [-1, 1].forEach((s) => {
      ctx.beginPath();
      ctx.moveTo(cx + s * 5, waistY - 2);
      ctx.lineTo(cx + s * (hp - 3), waistY + 6);
      ctx.quadraticCurveTo(cx + s * (thigh + 1), kneeY, cx + s * (bottomHalf + 3), endY);
      ctx.lineTo(cx + s * 3, endY);
      ctx.quadraticCurveTo(cx + s * 6, kneeY, cx + s * 4, crotchY);
      ctx.lineTo(cx + s * 2, waistY - 2);
      ctx.closePath();
      this._fillStroke(ctx, c);
      // 裤线
      ctx.strokeStyle = dk; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + s * (hp - 12), waistY + 12);
      ctx.quadraticCurveTo(cx + s * (thigh - 2), kneeY, cx + s * (bottomHalf + 1), endY - 4);
      ctx.stroke();
    });
    // 腰头
    ctx.fillStyle = c;
    ctx.fillRect(cx - hp + 2, waistY - 4, (hp - 2) * 2, 9);
    ctx.strokeStyle = dk; ctx.lineWidth = 1.2;
    ctx.strokeRect(cx - hp + 2, waistY - 4, (hp - 2) * 2, 9);
  }

  _drawShorts(ctx, A, item) { this._drawPants(ctx, A, item); }

  _drawSkirt(ctx, A, item) {
    const { cx, hp, waistY, hipY, crotchY, kneeY } = A;
    const c = item.color, dk = shadeColor(c, -20);
    const pleated = item.color === '#7B3F3F';
    const hemY = pleated ? crotchY + 22 : kneeY - 6;
    const flare = pleated ? 20 : 14;
    ctx.beginPath();
    ctx.moveTo(cx - hp + 2, waistY - 2);
    ctx.lineTo(cx - hp - flare, hemY);
    ctx.quadraticCurveTo(cx, hemY + 6, cx + hp + flare, hemY);
    ctx.lineTo(cx + hp - 2, waistY - 2);
    ctx.quadraticCurveTo(cx, waistY + 4, cx - hp + 2, waistY - 2);
    this._fillStroke(ctx, c);
    // 百褶线
    if (pleated) {
      ctx.strokeStyle = dk; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(cx + i * (hp / 2.5), waistY + 4);
        ctx.lineTo(cx + i * ((hp + flare) / 2.5), hemY - 2);
        ctx.stroke();
      }
    }
  }

  _drawShoes(ctx, A, item) {
    const { cx, feetY } = A;
    const c = item.color, dk = shadeColor(c, -25);
    [-1, 1].forEach((s) => {
      const x = cx + s * 9;
      ctx.fillStyle = c; ctx.strokeStyle = dk; ctx.lineWidth = 1.2;
      if (item.shape === 'sneakers') {
        ctx.beginPath(); ctx.ellipse(x, feetY + 2, 14, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = dk; ctx.fillRect(x - 14, feetY + 5, 28, 3);
      } else if (item.shape === 'boots') {
        ctx.beginPath();
        ctx.moveTo(x - 9, feetY - 38); ctx.lineTo(x + 8, feetY - 38);
        ctx.lineTo(x + 9, feetY + 2); ctx.ellipse(x, feetY + 2, 12, 6, 0, 0, Math.PI); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else if (item.shape === 'heels') {
        ctx.beginPath();
        ctx.moveTo(x - 11, feetY); ctx.lineTo(x + 12, feetY); ctx.lineTo(x + 9, feetY + 8);
        ctx.lineTo(x - 9, feetY + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillRect(x - 8, feetY + 8, 4, 9);
      } else { // loafers
        ctx.beginPath();
        ctx.ellipse(x, feetY + 2, 13, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x - 1, feetY - 2, 6, 4, 0, 0, Math.PI); ctx.stroke();
      }
    });
  }

  _drawAccessory(ctx, A, acc) {
    const { cx, neckY, shoulderY, bustY, headCY: cy, headR: R } = A;
    const c = acc.color, dk = shadeColor(c, -25);
    ctx.strokeStyle = c; ctx.fillStyle = c;
    if (acc.shape === 'necklace') {
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 13, shoulderY + 4);
      ctx.quadraticCurveTo(cx, bustY - 6, cx + 13, shoulderY + 4);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, bustY - 8, 3, 0, Math.PI * 2); ctx.fill();
    } else if (acc.shape === 'scarf') {
      ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 12, neckY + 6); ctx.quadraticCurveTo(cx, neckY + 14, cx + 12, neckY + 6); ctx.stroke();
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(cx + 8, neckY + 10); ctx.lineTo(cx + 14, bustY - 6); ctx.stroke();
    } else if (acc.shape === 'hat') {
      ctx.beginPath(); ctx.ellipse(cx, cy - R * 0.55, R * 1.25, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - R * 0.7, cy - R * 0.55);
      ctx.quadraticCurveTo(cx, cy - R * 1.5, cx + R * 0.7, cy - R * 0.55);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = dk; ctx.fillRect(cx - R * 0.7, cy - R * 0.62, R * 1.4, 4);
    } else if (acc.shape === 'bag') {
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + A.sh - 4, shoulderY + 6);
      ctx.quadraticCurveTo(cx + A.sh + 30, shoulderY + 30, cx + A.hp + 16, A.hipY + 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.roundRect?.(cx + A.hp + 4, A.hipY, 26, 34, 5);
      if (ctx.roundRect) ctx.fill(); else { ctx.fillRect(cx + A.hp + 4, A.hipY, 26, 34); }
    }
  }
}

function Avatar2D({ profile, outfit, view='front', showClothes=true }) {

// 颜色加深/变浅
function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00FF) + percent;
  let b = (num & 0x0000FF) + percent;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r<<16) | (g<<8) | b).toString(16).padStart(6,'0');
}

/* ============================================================
   RECOMMENDATION ENGINE
============================================================ */

function recommendOutfit(profile, lockedItems={}, excludeOutfit=null) {
  const pref = profile.preferences;
  const body = profile.body;
  const shape = calcBodyShape(body);

  const scoreItem = (item) => {
    let score = 0;
    // 风格匹配
    pref.likedStyles.forEach(s => { if (item.styles.includes(s)) score += 25; });
    pref.dislikedStyles.forEach(s => { if (item.styles.includes(s)) score -= 30; });
    // 颜色匹配
    if (pref.colors.length) {
      const colorMatch = pref.colors.some(c => colorDistance(c, item.color) < 60);
      if (colorMatch) score += 20;
    }
    // 场合匹配
    const allOcc = [profile.occasions.primary, ...profile.occasions.secondary];
    allOcc.forEach(o => { if (item.occasions.includes(o)) score += 15; });
    // 技巧匹配
    pref.techniques.forEach(t => { if (item.techniques.includes(t)) score += 10; });
    // 体型匹配
    if (item.bodyFit.includes(shape.type) || item.bodyFit.includes('all')) score += 10;
    return score + Math.random() * 5;
  };

  // 未锁定的槽位：换一身时排除当前已穿单品，保证结果真的变化
  const pick = (arr, slot) => {
    let pool = arr;
    if (!lockedItems[slot] && excludeOutfit?.[slot]) {
      const cur = excludeOutfit[slot];
      const curIds = Array.isArray(cur) ? cur.map(i => i.id) : [cur.id];
      const filtered = arr.filter(it => !curIds.includes(it.id));
      if (filtered.length) pool = filtered;
    }
    return [...pool].sort((a,b) => scoreItem(b) - scoreItem(a))[0];
  };

  const outfit = {
    top: lockedItems.top || pick(TOPS, 'top'),
    bottom: lockedItems.bottom || pick(BOTTOMS, 'bottom'),
    outerwear: lockedItems.outerwear || pick(OUTERWEARS, 'outerwear'),
    shoes: lockedItems.shoes || pick(SHOES, 'shoes'),
    accessories: lockedItems.accessories || [pick(ACCESSORIES, 'accessories')],
  };

  // 生成穿搭文案
  const desc = generateDescription(profile, outfit, shape);
  return { outfit, description: desc };
}

function colorDistance(c1, c2) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
}

function generateDescription(profile, outfit, shape) {
  const styleName = profile.preferences.likedStyles[0] ? STYLES.find(s=>s.id===profile.preferences.likedStyles[0])?.name : '百搭';
  const occName = OCCASIONS.find(o=>o.id===profile.occasions.primary)?.name || '日常';
  const tips = [];
  if (shape.type === 'curvy' || shape.type === 'plus') tips.push('选择高腰下装拉长腿部比例，视觉上收窄腰线');
  if (shape.whr > 0.85) tips.push('A字版型修饰胯宽，上装选择V领或开领拉长颈部线条');
  if (profile.body.legRatio < 0.48) tips.push('短款上衣 + 高腰下装 = 黄金比例，显高 5cm');
  if (profile.body.legRatio > 0.55) tips.push('你的腿长比例优越，可大胆尝试长款外套或过膝靴');
  if (profile.body.height < 160) tips.push('同色系穿搭 + 尖头鞋，从脚踝到头顶一条直线最显高');
  if (tips.length === 0) tips.push('标准身材可驾驭多种风格，重点突出个人气质与场合适配');

  return {
    concept: `以「${styleName}」为基调，为「${occName}」场合量身打造。整体配色${profile.preferences.colors.length ? '呼应你偏好的色系' : '以经典黑白灰为骨架'}，${profile.preferences.techniques.includes('oversize') ? '用 oversize 廓形营造松弛感' : profile.preferences.techniques.includes('contrast') ? '用撞色制造视觉焦点' : '用合身剪裁展现利落线条'}。`,
    items: [
      `${outfit.top.name} —— 作为内搭奠定整体调性`,
      `${outfit.bottom.name} —— 修饰腿型，平衡上下比例`,
      outfit.outerwear ? `${outfit.outerwear.name} —— 提升层次感与气场` : null,
      `${outfit.shoes.name} —— 点睛之笔，决定风格走向`,
      ...outfit.accessories.map(a => `${a.name} —— 细节处见品味`),
    ].filter(Boolean),
    tips,
    logic: `上装与下装在${profile.preferences.techniques.includes('monochrome') ? '同色系' : '色彩明度'}上形成呼应，外套作为过渡层增加节奏，鞋包配饰统一色调完成闭环。`,
    fitReason: `根据你的身材数据（BMI ${shape.bmi.toFixed(1)}，腰臀比 ${shape.whr.toFixed(2)}），${tips[0].split('，')[0]}，让这套穿搭既好看又显瘦。`,
  };
}

function Field({ label, value, unit, onChange, disabled }) {
  // 内部维护文本态：输入过程中允许清空、中间编辑，不被数字强转打断
  const [text, setText] = useState(value === '' || value == null ? '' : String(value));
  const [focused, setFocused] = useState(false);

  // 外部值变化（如点选 S/M/L 尺码、页面初始化）时同步；正在输入时不打断
  useEffect(() => {
    if (!focused) setText(value === '' || value == null ? '' : String(value));
  }, [value, focused]);

  const commit = (raw) => {
    if (raw === '' || raw === '-') { onChange(''); return; }
    const n = Number(raw);
    if (!isNaN(n) && n >= 0) onChange(n);
  };

  return (
    <div className={disabled ? 'opacity-50 pointer-events-none select-none' : ''}>
      <label className="text-sm font-medium mb-1 block text-midgray">{label}</label>
      <div className="relative">
        <input type="number" min="0" step="any" inputMode="decimal" value={text} disabled={disabled}
          placeholder="—"
          onChange={e => { setText(e.target.value); commit(e.target.value); }}
          onFocus={() => setFocused(true)}
          onBlur={() => {
            setFocused(false);
            const n = Number(text);
            if (text === '' || isNaN(n) || n < 0) { onChange(0); setText('0'); }
            else setText(String(n));
          }}
          className="w-full px-4 py-3 pr-12 border border-grayline rounded-xl focus:border-klein focus:outline-none focus:ring-2 focus:ring-klein/10 bg-white transition"/>
        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-midgray pointer-events-none">{unit}</span>
      </div>
    </div>
  );
}

function ControlGroup({ label, children }) {
  return (
    <div>
      <label className="text-sm font-medium mb-2 block">{label}</label>
      {children}
    </div>
  );
}

function SliderRow({ label, value, min, max, step, onChange }) {
  const pct = ((Number(value) - min) / (max - min)) * 100;
  return (
    <div>
      <div className="flex justify-between text-xs text-midgray mb-1">
        <span>{label}</span>
        <span className="tabular-nums">{Number(value).toFixed(2)}×</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={(e)=>onChange(parseFloat(e.target.value))}
        className="w-full"
        style={{background:`linear-gradient(to right, #002FA7 ${pct}%, #E5E5E0 ${pct}%)`}}/>
    </div>
  );
}

function StyleScreen({ profile, update, next, back }) {
  const [phase, setPhase] = useState(0); // 0:styles 1:colors 2:techniques
  const p = profile.preferences;
  const setPref = (k, v) => update({ preferences: { ...p, [k]: v }});

  const toggleStyle = (id, liked) => {
    if (liked) {
      update({ preferences: {
        ...p,
        likedStyles: p.likedStyles.includes(id) ? p.likedStyles.filter(s=>s!==id) : [...p.likedStyles, id],
        dislikedStyles: p.dislikedStyles.filter(s=>s!==id),
      }});
    } else {
      update({ preferences: {
        ...p,
        dislikedStyles: p.dislikedStyles.includes(id) ? p.dislikedStyles.filter(s=>s!==id) : [...p.dislikedStyles, id],
        likedStyles: p.likedStyles.filter(s=>s!==id),
      }});
    }
  };

  const toggleColor = (c) => {
    setPref('colors', p.colors.includes(c) ? p.colors.filter(x=>x!==c) : [...p.colors, c]);
  };

  const toggleTech = (id) => {
    setPref('techniques', p.techniques.includes(id) ? p.techniques.filter(t=>t!==id) : [...p.techniques, id]);
  };

  const canNext = phase === 0 ? p.likedStyles.length > 0 : phase === 1 ? p.colors.length > 0 : true;

  return (
    <div>
      <StepProgress step={3} total={6} onBack={back}/>
      <div className="max-w-5xl mx-auto px-4 py-10">
        <div className="mb-8 fade-up">
          <div className="text-klein text-sm font-medium mb-2">STEP 03 · 对话 {phase+1}/3</div>
          <h2 className="font-display text-4xl font-bold mb-2">
            {phase===0 && '你喜欢什么风格？'}
            {phase===1 && '偏好哪些颜色？'}
            {phase===2 && '喜欢什么穿搭技巧？'}
          </h2>
          <p className="text-midgray">
            {phase===0 && '点击喜欢或不喜欢，AI 会据此筛选适合你的单品'}
            {phase===1 && '多选，AI 会在推荐中优先使用这些颜色'}
            {phase===2 && '可多选，决定整体穿搭的版型与搭配逻辑'}
          </p>
        </div>

        {/* 对话气泡 */}
        <div className="flex gap-3 mb-8 fade-up">
          <div className="w-10 h-10 rounded-full bg-klein flex items-center justify-center text-white text-sm shrink-0">AI</div>
          <div className="bg-kleinsoft rounded-2xl rounded-tl-sm px-5 py-3 max-w-md">
            {phase===0 && `先选选风格吧～我准备了 ${STYLES.length} 种主流风格，点 ❤️ 喜欢或 ✕ 不喜欢`}
            {phase===1 && `好的！你喜欢「${p.likedStyles.map(id=>STYLES.find(s=>s.id===id)?.name).join('、')}」。再挑挑颜色？`}
            {phase===2 && `颜色记下了。最后，你平时偏爱哪种穿法？`}
          </div>
        </div>

        <div className="fade-up">
          {phase === 0 && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {STYLES.map(s => {
                const liked = p.likedStyles.includes(s.id);
                const disliked = p.dislikedStyles.includes(s.id);
                return (
                  <div key={s.id} className={`rounded-2xl border-2 p-4 transition ${liked ? 'border-klein bg-kleinsoft' : disliked ? 'border-grayline bg-grayline/30 opacity-50' : 'border-grayline bg-white hover:-translate-y-1'}`}>
                    <div className="text-3xl mb-2">{s.icon}</div>
                    <div className="font-bold text-sm mb-1">{s.name}</div>
                    <div className="text-xs text-midgray mb-3">{s.desc}</div>
                    <div className="flex gap-2">
                      <button onClick={()=>toggleStyle(s.id, true)} className={`flex-1 py-1.5 rounded-lg text-xs transition ${liked ? 'bg-klein text-white' : 'bg-paper hover:bg-klein hover:text-white'}`}>❤️ 喜欢</button>
                      <button onClick={()=>toggleStyle(s.id, false)} className={`flex-1 py-1.5 rounded-lg text-xs transition ${disliked ? 'bg-ink text-white' : 'bg-paper hover:bg-ink hover:text-white'}`}>✕ 不喜欢</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {phase === 1 && (
            <div>
              <div className="flex flex-wrap gap-2 mb-6">
                {COLOR_PALETTE.map(c => (
                  <button key={c} onClick={()=>toggleColor(c)}
                    className={`w-10 h-10 rounded-full border-2 transition ${p.colors.includes(c) ? 'border-klein scale-110 ring-2 ring-klein/30' : 'border-white shadow'}`}
                    style={{background:c}}/>
                ))}
              </div>
              {p.colors.length > 0 && (
                <div className="p-3 bg-kleinsoft rounded-xl text-sm">
                  已选 <span className="font-bold">{p.colors.length}</span> 种颜色
                  <div className="flex gap-1 mt-2">
                    {p.colors.map(c => <span key={c} className="w-5 h-5 rounded-full" style={{background:c}}/>)}
                  </div>
                </div>
              )}
            </div>
          )}

          {phase === 2 && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {TECHNIQUES.map(t => (
                <button key={t.id} onClick={()=>toggleTech(t.id)}
                  className={`text-left p-4 rounded-2xl border-2 transition ${p.techniques.includes(t.id) ? 'border-klein bg-kleinsoft' : 'border-grayline bg-white hover:border-ink/30'}`}>
                  <div className="font-bold mb-1">{t.name}</div>
                  <div className="text-xs text-midgray">{t.desc}</div>
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="flex justify-between mt-10">
          {phase > 0 ? (
            <button onClick={()=>setPhase(phase-1)} className="px-8 py-4 border border-grayline rounded-full hover:bg-paper">← 上一题</button>
          ) : <button onClick={back} className="px-8 py-4 border border-grayline rounded-full hover:bg-paper">← 返回</button>}
          {phase < 2 ? (
            <button onClick={()=>setPhase(phase+1)} disabled={!canNext}
              className="px-10 py-4 bg-ink text-white rounded-full hover:bg-klein transition disabled:opacity-40">下一题 →</button>
          ) : (
            <button onClick={next} className="px-10 py-4 bg-ink text-white rounded-full hover:bg-klein transition">下一步：选择场合 →</button>
          )}
        </div>
      </div>
    </div>
  );
}

      const keep = {};
      if (locked.top) keep.top = outfit.outfit.top;

      if (locked.outerwear) keep.outerwear = outfit.outfit.outerwear;

                      {shopLinks(item.keyword).map(s => (
                        <a key={s.name} href={s.url} target="_blank" rel="noopener"
                          className="px-3 py-1.5 rounded-full text-xs text-white transition hover:opacity-80"
                          style={{background: s.color}}>{s.name}</a>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-6 p-4 bg-kleinsoft rounded-xl text-sm">
                💡 <strong>平替提示：</strong>在淘宝搜索关键词时加上「平替」「同款」「平价」可找到更实惠的选择
              </div>
              <div className="flex justify-center gap-4 mt-6">
                <button onClick={()=>setShowShop(false)} className="px-6 py-3 border border-grayline rounded-full text-sm hover:bg-paper">← 返回</button>
                <button onClick={restart} className="px-6 py-3 bg-ink text-white rounded-full text-sm hover:bg-klein">重新开始</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
============================================================ */

function App() {
  const [step, setStep] = useState(0); // 0:home 1:body 2:avatar 3:style 4:occasion 5:result
  const [profile, setProfile] = useState(initialProfile);
  const [outfitResult, setOutfitResult] = useState(null);

  const update = (partial) => setProfile(p => ({ ...p, ...partial }));

  const goNext = () => {
    if (step === 4) {
      // 生成穿搭
      const result = recommendOutfit(profile, {});
      setOutfitResult(result);
      setStep(5);
    } else {
      setStep(s => s + 1);
    }
  };

  const regenerate = (locked) => {
    // 传入当前穿搭作为排除集，未锁定槽位会换新单品
    const result = recommendOutfit(profile, locked, outfitResult?.outfit);
    setOutfitResult(result);
  };

  const restart = () => {
    setProfile(initialProfile);
    setOutfitResult(null);
    setStep(0);
  };

  return (
    <div className="min-h-screen bg-paper">
      {step === 0 && <HomeScreen onStart={()=>setStep(1)}/>}
      {step === 1 && <BodyDataScreen profile={profile} update={update} next={goNext} back={()=>setStep(0)}/>}
      {step === 2 && <AvatarScreen profile={profile} update={update} next={goNext} back={()=>setStep(1)}/>}
      {step === 3 && <StyleScreen profile={profile} update={update} next={goNext} back={()=>setStep(2)}/>}
      {step === 4 && <OccasionScreen profile={profile} update={update} next={goNext} back={()=>setStep(3)}/>}
      {step === 5 && outfitResult && (
        <ResultScreen profile={profile} outfit={outfitResult} description={outfitResult.description}
          regenerate={regenerate} back={()=>setStep(4)} restart={restart}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
